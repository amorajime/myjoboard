name: Deploy to GitHub Pages

# Optional manual deployment. GitHub Pages is already configured to deploy
# from the main branch, so running this workflow on every push creates two
# simultaneous deployments to the same environment.

on:
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "." # serve the whole repo root (index.html at root)

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
